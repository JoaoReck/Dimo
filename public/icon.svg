<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Deep background -->
    <rect width="512" height="512" fill="#0B0D12"/>
    
    <!-- Subtle circular glow -->
    <circle cx="256" cy="256" r="180" fill="#22C55E" opacity="0.08"/>
    
    <g transform="translate(30.72, 30.72) scale(0.88)">
      <!-- Rounded container box -->
      <rect x="56" y="56" width="400" height="400" rx="90" fill="#13161D" stroke="#252A33" stroke-width="8"/>
      <rect x="56" y="56" width="400" height="400" rx="90" stroke="#22C55E" stroke-opacity="0.3" stroke-width="4"/>
      
      <!-- Inner Dimo symbol (scaled from 32x32 to 240x240 inside box) -->
      <g transform="translate(136, 136) scale(7.5)">
        <!-- Vertical timeline spine -->
        <line x1="10" y1="6" x2="10" y2="26" stroke="#22C55E" stroke-opacity="0.45" stroke-width="2.6" stroke-linecap="round"/>
        
        <!-- Semicircular journey / cycle path forming the loop of 'D' -->
        <path d="M 10 7.5 H 17 C 22.5 7.5 25.5 11 25.5 16 C 25.5 21 22.5 24.5 17 24.5 H 10" 
              stroke="#22C55E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        
        <!-- Waypoint node glow -->
        <circle cx="10" cy="16" r="5.5" stroke="#86EFAC" stroke-width="1.2" stroke-opacity="0.5"/>
        
        <!-- Waypoint node center -->
        <circle cx="10" cy="16" r="3.5" fill="#22C55E"/>
      </g>
    </g>
  </svg>